CONFIG_GABS_TEST=y
CONFIG_STD_CPP17=y

CONFIG_TEST_LOGGING_DEFAULTS=n
CONFIG_SERIAL=y
CONFIG_EMUL=y
CONFIG_UART_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PRINTK=n
CONFIG_CBPRINTF_FP_SUPPORT=y

# Disable other default backends so only the emulated UART receives output.
CONFIG_LOG_BACKEND_NATIVE_POSIX=n
