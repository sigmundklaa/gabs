CONFIG_ZTEST=y

# Test sources are compiled as C++, as the Catch2 implementation of the
# testing module requires it.
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# The ztest backend's GABS_SUITE_F uses placement new to construct fixtures,
# which Zephyr's minimal C++ library doesn't provide.
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_GABS=y
